[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacompass"
version = "0.1.0"
description = "A tool-using agent for BI metadata questions that knows when to abstain."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ozan Dokur" }]
dependencies = [
    "pydantic>=2.7",
    "pandas>=3.0",
    "numpy>=2.0",
    "networkx>=3.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "faker>=25.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27", "jsonschema>=4.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metacompass = ["data/vocab/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests", "eval", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["slow: downloads models", "live: calls a paid LLM API"]
addopts = "-m 'not slow and not live'"

[tool.coverage.run]
source = ["metacompass"]
omit = ["*/metacompass/data/generate.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
